<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Fan Voting Study</title>
<style>
:root{--ink:#111;--muted:#555;--line:#d9d9d9;--accent:#1f3a8a;--accent-soft:#e8edfb;--bg:#f6f6f4;--card:#fff;--win:#14532d;--lose:#7f1d1d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px 26px}
.progress{height:6px;background:#e5e5e5;border-radius:3px;margin-bottom:18px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.step{font-size:13px;color:var(--muted);margin-bottom:4px}
h1{font-size:26px;line-height:1.25;margin:0 0 12px}
p{margin:0 0 12px}
.fine{font-size:14px;color:var(--muted)}
.members{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.member{border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff;text-align:center;cursor:pointer;font:inherit;color:inherit}
.member video,.member img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;background:#000}
.member b{display:block;font-size:19px;margin-top:6px}
.member small{color:var(--muted)}
.num{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:99px;background:#111827;color:#fff;font-size:14px;font-weight:700}
.member .num+b{margin-top:2px}
.member[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.member.static{cursor:default}
.pick{display:block;margin:8px auto 2px;padding:9px 6px;border:1.5px solid #999;border-radius:10px;font-weight:600;font-size:15px;background:#fff}
.member[aria-pressed=true] .pick{background:var(--accent);border-color:var(--accent);color:#fff}
.member.winner{border-color:var(--win);box-shadow:0 0 0 2px var(--win)}
.member.loser{opacity:.45}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:4px}
.tag.win{background:#dcfce7;color:var(--win)}
.tag.you{background:var(--accent-soft);color:var(--accent)}
.q{margin:18px 0 6px;font-weight:600}
.scale{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.scale .opt{min-width:0;padding:8px 0}
.scale.s10{grid-template-columns:repeat(10,minmax(0,1fr))}
.share{margin-top:10px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:46px;min-width:46px;padding:8px 12px;border:1.5px solid #999;border-radius:10px;background:#fff;font:inherit;color:inherit;cursor:pointer}
.opt[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.buy{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.buy .opt{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:8px 2px}
.buy .opt small{font-size:12px;opacity:.85}
.next{display:block;width:100%;margin-top:24px;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-family:inherit;font-weight:600;font-size:18px;line-height:1.2;cursor:pointer}
.next:disabled{background:#b8b8b8;cursor:not-allowed}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;background:#fafafa}
.tokens{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.t{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c7d2fe,#6d7fd6);border:1px solid #4a5aa8}
.t.used{background:#eee;border:1px dashed #999}
.tokens.many{gap:3px}
.tokens.many .t{width:14px;height:14px}
.big{font-size:22px;font-weight:700}
.result{font-size:24px;font-weight:800;margin:6px 0 2px}
.tally{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:10px 0 4px;font-size:14px;font-weight:700;color:#fff}
.tally span{display:flex;align-items:center;justify-content:center}
.tally .w{background:var(--win)}.tally .l{background:#9ca3af}
.notice{padding:12px 14px;border-radius:10px;background:#fff4e5;border:1px solid #f0c27b}
.err{color:var(--lose);font-size:15px;min-height:1em;margin-top:8px}
.review{background:#fff7d6;border:1px solid #e3c766;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.review select{font:inherit;font-size:14px}
.cellhead{margin:28px 0 8px;font-size:15px;font-weight:700;color:#7a5b00;background:#fff7d6;border:1px solid #e3c766;border-radius:8px;padding:6px 10px;break-after:avoid}
.print .sheet{margin-bottom:14px;break-inside:avoid}
pre{white-space:pre-wrap;font-size:12px;background:#f3f3f3;padding:10px;border-radius:8px;max-height:260px;overflow:auto}
@media (max-width:480px){h1{font-size:23px}.sheet{padding:18px 14px 22px}.scale{gap:4px}.scale.s10{grid-template-columns:repeat(5,minmax(0,1fr))}.buy{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
'use strict';
// ---- Settings (edit here). Numbers come from the field data unless noted. ----
const CONFIG={
  version:'two-studies-2026-11-24-v14',
  waitSeconds:5,                       // same counting wait for voters and fans who missed the vote (Kim et al. 2019, Exp. 4)
  money:'$', price:2.99,               // one digital card in the group's app (US App Store price); one card = one voting token
  tokens:{small:4,large:40},           // median pre-vote token balance of small and large first-time voters (4 and 41)
  roundVoters:3600, roundTokens:18000, // median round in the sample: 3,616 voters casting 17,850 tokens
  tally:{winner:54,loser:46},          // share of tokens in the first vote (shown for both outcomes)
  castOptions:{small:[1,2,3,4],large:[1,2,3,5,10,20,40]},
  buyOptions:[0,1,2,3,5,10],
  askExchange:false,                   // true adds the card-exchange item (the field's transfer outcome) to the last page
  askSatisfaction:true,                // satisfaction with the company, 1-10, after the result (Kim et al. 2019, Exp. 4)
  shareSentence:true,                  // both studies: the stake's share of a typical round, 1 in 4,500 vs 1 in 450 (after Kim et al. 2019, Exp. 1C)
  askVoteAgain:false,                  // OFF since 2026-11-24 (Bruce: "Turn it off"; H4 left the paper on Nov 23). On = "Will you vote in the next vote?" yes/no before the card question
  askFeltInfluence:true,               // the vote-page influence item asked again of everyone after the result (H3 disconfirmation)
  members:{
    seoyeon:{name:'Seoyeon',video:'media/seoyeon_5s.mp4',photo:'media/seoyeon.jpg'},
    yooyeon:{name:'Yooyeon',video:'media/yooyeon_5s.mp4',photo:'media/yooyeon.jpg'}
  },
  topic1:'which member performs a solo stage at the next concert',
  topic2:'which member appears on the cover of the next single'
};
// Study 1 (H1, H2): voted vs missed the vote (Kim et al. 2019, Exp. 4) x small vs large stake (Exp. 1B-1C); the winner is drawn 50/50 in every cell.
// Study 2 (H3, H4): small vs large stake x favorite wins vs loses; everyone votes.
const CELLS=[
  ...['voted','missed'].flatMap(v=>['small','large'].map(s=>({study:1,vote:v,stake:s,outcome:null}))),
  ...['small','large'].flatMap(s=>['win','loss'].map(o=>({study:2,vote:'voted',stake:s,outcome:o})))
];
const cellId=c=>c.study===1?`S1-${c.vote}-${c.stake}`:`S2-${c.stake}-${c.outcome}`;
const QS=new URLSearchParams(location.search);
const REVIEW=QS.has('review'),PRINT=QS.has('print');
const $=s=>document.querySelector(s);
const app=$('#app');
function pick(a){const x=crypto.getRandomValues(new Uint32Array(1))[0];return a[x%a.length];}
const money=n=>CONFIG.money+n.toFixed(2);
const fmt=n=>n.toLocaleString('en-US');
let run,page=0;

function newRun(forced,forcedOutcome){
  const pool=QS.get('study')?CELLS.filter(c=>String(c.study)===QS.get('study')):CELLS;
  const c=forced||pick(pool);
  run={version:CONFIG.version,started_at:new Date().toISOString(),
    assignment:forced?'researcher_preview':(QS.get('study')?`random_within_study_${QS.get('study')}`:'random_1_of_8'),
    cell:cellId(c),study:c.study,vote:c.vote,stake:c.stake,
    outcome:c.outcome||forcedOutcome||pick(['win','loss']),outcome_drawn:c.study===1,
    member_order:pick([['seoyeon','yooyeon'],['yooyeon','seoyeon']]),responses:{},clips:{},pages:[]};
  run.tokens=CONFIG.tokens[run.stake];
}
const voted=()=>run.vote==='voted';
const cast=()=>voted()?(run.responses.tokens_cast||0):0;
const left=()=>run.tokens-cast();
const chosen=()=>run.responses.preferred_member;
const other=()=>run.member_order.find(m=>m!==chosen());
const winner=()=>run.outcome==='win'?chosen():other();
// Members carry a number by screen position (left tile = Member 1) so the two names are easy to tell apart (v14, Bruce 2026-11-24)
const num=id=>run.member_order.indexOf(id)+1;
const mno=id=>'Member '+num(id);
const nm=id=>`${mno(id)} (${CONFIG.members[id].name})`;

// ---- Small builders ----
function scale(name,question,lo,hi,max=7){
  return `<div class="q">${question}</div><div class="scale${max===10?' s10':''}" data-name="${name}">${Array.from({length:max},(_,i)=>`<button type="button" class="opt" data-v="${i+1}" aria-pressed="false">${i+1}</button>`).join('')}</div><div class="ends"><span>1 = ${lo}</span><span>${max} = ${hi}</span></div>`;
}
function choice(name,question,opts){
  return `<div class="q">${question}</div><div class="opts" data-name="${name}">${opts.map(([v,l])=>`<button type="button" class="opt" data-v="${v}" aria-pressed="false">${l}</button>`).join('')}</div>`;
}
function tokens(n,used=0){return `<div class="tokens${n>20?' many':''}" aria-label="${n} tokens">${Array.from({length:n},(_,i)=>`<span class="t${i<used?' used':''}"></span>`).join('')}</div>`;}
function memberTile(id,mode){
  const m=CONFIG.members[id];
  if(mode==='clip')return `<button type="button" class="member" data-member="${id}" aria-pressed="false"><video src="${m.video}" poster="${m.photo}" muted playsinline autoplay preload="auto"></video><span class="num">${mno(id)}</span><b>${m.name}</b><small>tripleS</small><span class="pick" data-pick>Choose ${mno(id)}</span></button>`;
  const w=winner()===id,cls=mode==='result'?(w?' winner':' loser'):'';
  return `<div class="member static${cls}"><img src="${m.photo}" alt=""><span class="num">${mno(id)}</span><b>${m.name}</b>${id===chosen()?'<span class="tag you">You like her more</span>':''}${mode==='result'&&w?' <span class="tag win">Winner</span>':''}</div>`;
}
const nextBtn=(label='Next')=>`<button class="next" id="next" disabled>${label}</button><div class="err" id="err"></div>`;
const crowd=()=>`About ${fmt(CONFIG.roundVoters)} fans vote in a typical round and cast about ${fmt(CONFIG.roundTokens)} tokens in total. The count stays hidden until voting closes.`;

// ---- Pages ----
const PAGES=[
 {id:'welcome',need:[],html:()=>`
  <h1>Fan Voting Study</h1>
  <p>You will watch two 5-second clips of a K-pop group, read a short story about a fan vote, and answer a few questions. It takes about 3 minutes.</p>
  <p><b>The story is imaginary.</b> You do not spend any money, and your payment is fixed.</p>
  ${nextBtn('I am 18 or older and agree to take part')}`},

 {id:'members',need:['preferred_member'],html:()=>`
  <h1>Meet two members of tripleS</h1>
  <p>tripleS is a K-pop girl group. In the group's app, fans buy digital photo cards for ${money(CONFIG.price)} each. <b>Each card gives 1 voting token.</b> Fans spend tokens to vote on group decisions, such as which member performs a solo stage. <b>A token is used up when it is cast.</b></p>
  <div class="q">Which member do you like more? Tap her button.</div>
  <div class="members">${run.member_order.map(id=>memberTile(id,'clip')).join('')}</div>
  ${nextBtn()}`},

 {id:'vote',need:()=>voted()?['tokens_cast','expected_influence']:[],html:()=>`
  <h1>Fans are voting.</h1>
  <p>The vote decides ${CONFIG.topic1}. <b>${nm(chosen())}</b> and <b>${nm(other())}</b> are the candidates. The member with more tokens wins.</p>
  <p class="fine">${crowd()}</p>
  <div class="box"><div class="big">You hold ${run.tokens} tokens.</div>${tokens(run.tokens)}${CONFIG.shareSentence?`<div class="share">Your ${run.tokens} tokens are about 1 in every ${fmt(Math.round(CONFIG.roundTokens/run.tokens))} tokens cast in a typical round.</div>`:''}</div>
  ${voted()?`
   ${choice('tokens_cast',`How many of your ${run.tokens} tokens do you cast for ${nm(chosen())}?`,CONFIG.castOptions[run.stake].map(n=>[String(n),String(n)]))}
   ${scale('expected_influence','How much do you feel your votes can change who wins?','Not at all','A great deal')}
   ${nextBtn('Cast my tokens')}`
  :`<div class="notice">Imagine you were busy that day. When you opened the app, voting had just closed. <b>Your ${run.tokens} tokens were not cast.</b></div>
   ${nextBtn('Continue')}`}`},

 // Result and next vote on one page: choices first (vote again, cards bought), ratings on the next page (Kim et al. 2019, Exp. 1C and 2).
 {id:'result',need:()=>[...(CONFIG.askVoteAgain?['vote_again']:[]),'cards_bought',...(CONFIG.askExchange?['card_exchange']:[])],html:()=>`
  <h1>Voting has closed.</h1>
  <div class="result">${nm(winner())} performs the solo stage.</div>
  <div class="tally"><span class="w" style="width:${CONFIG.tally.winner}%">${mno(winner())} ${CONFIG.tally.winner}%</span><span class="l" style="width:${CONFIG.tally.loser}%">${mno(winner()===chosen()?other():chosen())} ${CONFIG.tally.loser}%</span></div>
  <p class="fine">Share of all tokens cast.</p>
  <p><b>${voted()?`The member you voted for ${run.outcome==='win'?'won':'lost'}.`:`The member you like more ${run.outcome==='win'?'won':'lost'}.`}</b>
   ${voted()?`You cast ${cast()} ${cast()===1?'token':'tokens'}, which ${cast()===1?'is':'are'} now used up. You have ${left()} left.`:`Your ${run.tokens} tokens are still unspent.`}</p>
  <div class="members">${run.member_order.map(id=>memberTile(id,'result')).join('')}</div>
  <h2 class="q" style="font-size:20px;margin-top:26px">Next week, fans vote again.</h2>
  <p>The new vote decides ${CONFIG.topic2}. ${nm(chosen())} and ${nm(other())} are again the candidates.</p>
  <div class="box"><div class="big">You have ${left()} tokens now.</div>${tokens(run.tokens,cast())}<div class="fine">Each card costs ${money(CONFIG.price)} and gives 1 token.</div></div>
  ${CONFIG.askVoteAgain?choice('vote_again','Will you vote in the next vote?',[['yes','Yes'],['no','No']]):''}
  <div class="q">How many cards would you buy before this vote?</div>
  <div class="buy" data-name="cards_bought">${CONFIG.buyOptions.map(n=>`<button type="button" class="opt" data-v="${n}" aria-pressed="false"><b>${n}</b><small>${money(n*CONFIG.price)}</small></button>`).join('')}</div>
  ${CONFIG.askExchange?scale('card_exchange','Before the next vote, how likely are you to send or swap cards with other fans?','Very unlikely','Very likely'):''}
  ${nextBtn()}`},

 {id:'views',need:()=>['disappointment',...(CONFIG.askSatisfaction?['satisfaction']:[]),...(CONFIG.askFeltInfluence?['felt_influence']:[]),...(run.study===1?['check_voted']:[]),'check_tokens','check_outcome'],html:()=>`
  <h1>A few last questions.</h1>
  <p class="fine">Think back to the first vote.</p>
  ${scale('disappointment','How disappointed do you feel?','Not at all','Very')}
  ${CONFIG.askSatisfaction?scale('satisfaction','How satisfied are you with the company that runs the group\'s app and its votes?','Not at all','Very satisfied',10):''}
  ${CONFIG.askFeltInfluence?scale('felt_influence','How much do you feel your votes can change who wins?','Not at all','A great deal'):''}
  ${run.study===1?choice('check_voted','In the first vote, did you cast your tokens?',[['yes','Yes'],['no','No, voting had closed'],['unsure','Not sure']]):''}
  ${choice('check_tokens','Before the first vote, how many tokens did you hold?',[[String(CONFIG.tokens.small),String(CONFIG.tokens.small)],[String(CONFIG.tokens.large),String(CONFIG.tokens.large)],['unsure','Not sure']])}
  ${choice('check_outcome','Who performs the solo stage?',[...run.member_order.map(id=>[id,nm(id)]),['unsure','Not sure']])}
  ${nextBtn('Finish')}`},

 {id:'end',need:[],html:()=>`
  <h1>Thank you!</h1>
  <p>This study asks how voting, the number of tokens a fan holds, and a win or loss shape fans' plans to ${CONFIG.askVoteAgain?'vote again and ':''}buy cards. The story and the vote result were imaginary and assigned at random. The card price and the number of voters match the group's app. No money was spent.</p>
  ${REVIEW?`<button class="next" id="dl">Download test record (JSON)</button><button class="next" id="again" style="background:#555">Start again</button><pre>${JSON.stringify(run,null,1).replace(/</g,'&lt;')}</pre>`:''}`}
];
const COUNTED=PAGES.length-1;
const needOf=P=>typeof P.need==='function'?P.need():P.need;

function render(){
  const P=PAGES[page];
  const bar=page>0&&page<COUNTED?`<div class="step">Page ${page} of ${COUNTED-1}</div><div class="progress"><span style="width:${100*page/(COUNTED-1)}%"></span></div>`:'';
  app.innerHTML=`${REVIEW?reviewBar():''}<section class="sheet" data-page="${P.id}">${bar}${P.html()}</section>`;
  wire(P);window.scrollTo(0,0);
}
// After the vote page, voters and fans who missed the vote wait the same time while tokens are counted (Kim et al. 2019, Exp. 4).
let waitId=0;
function countThen(next){
  const id=++waitId,s=CONFIG.waitSeconds;
  app.innerHTML=`${REVIEW?reviewBar():''}<section class="sheet" data-page="count"><h1>Counting the tokens.</h1><p>Voting has closed. The result appears in a few seconds.</p><div class="progress"><span id="cbar" style="width:0%;transition:width ${s}s linear"></span></div></section>`;
  if(REVIEW){const go=$('#rvgo');if(go)go.onclick=()=>{waitId++;restartFromReview();};}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$('#cbar');if(b)b.style.width='100%';}));
  run.wait_seconds=s;window.scrollTo(0,0);
  setTimeout(()=>{if(id===waitId)next();},s*1000);
}
function reviewBar(){
  return `<div class="review"><b>Researcher preview</b> (not shown to participants) · Cell:
   <select id="rv">${CELLS.map((c,i)=>`<option value="${i}"${run&&run.cell===cellId(c)?' selected':''}>${cellId(c)}</option>`).join('')}</select>
   · Study 1 winner: <select id="rvo"><option value="">random 50/50</option><option value="win">favorite wins</option><option value="loss">favorite loses</option></select>
   <button id="rvgo">Restart in this cell</button> · <a href="?print">Print all pages</a></div>`;
}
function restartFromReview(){newRun(CELLS[Number($('#rv').value)],$('#rvo').value||undefined);page=0;render();}
function ready(P){return needOf(P).every(k=>run.responses[k]!==undefined);}
function wire(P){
  const btn=$('#next'),upd=()=>{if(btn)btn.disabled=!ready(P);};
  app.querySelectorAll('[data-name]').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    g.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const v=b.dataset.v;run.responses[g.dataset.name]=/^\d+$/.test(v)?Number(v):v;upd();}));
  app.querySelectorAll('.member[data-member]').forEach(b=>{
    b.onclick=()=>{app.querySelectorAll('.member[data-member]').forEach(x=>{x.setAttribute('aria-pressed',x===b);x.querySelector('[data-pick]').textContent=(x===b?'✓ Chosen: ':'Choose ')+mno(x.dataset.member);});run.responses.preferred_member=b.dataset.member;upd();};
    const v=b.querySelector('video'),id=b.dataset.member;run.clips[id]=run.clips[id]||{played:false,ended:false};
    v.onplay=()=>run.clips[id].played=true;v.onended=()=>run.clips[id].ended=true;
    v.play?.().catch(()=>{});
  });
  if(btn)btn.onclick=()=>{if(!ready(P))return;run.pages.push({page:P.id,done_at:new Date().toISOString()});page++;
    if(PAGES[page].id==='end'){run.completed_at=new Date().toISOString();run.tokens_left=left();}
    if(P.id==='vote')countThen(render);else render();};
  if(REVIEW){
    const go=$('#rvgo');if(go)go.onclick=restartFromReview;
    const dl=$('#dl');if(dl)dl.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(run,null,2)],{type:'application/json'}));a.download=`fan_voting_${run.cell}.json`;a.click();};
    const ag=$('#again');if(ag)ag.onclick=()=>{newRun();page=0;render();};
  }
  upd();
}
// ?print: every page as participants see it, for the cells listed in ?print=... (default: one path per arm)
function renderPrint(){
  const list=(QS.get('print')||'S1-voted-small,S1-missed-large,S2-small-loss,S2-large-loss').split(',');
  let html='';
  list.forEach((id,k)=>{
    const c=CELLS.find(x=>cellId(x)===id);if(!c)return;
    newRun(c,k%2?'loss':'win');run.member_order=['seoyeon','yooyeon'];run.responses.preferred_member='seoyeon';
    if(voted())run.responses.tokens_cast=Math.min(CONFIG.tokens[run.stake],run.stake==='large'?10:2);
    const pages=k===0?PAGES.slice(0,COUNTED):PAGES.slice(2,COUNTED);
    html+=`<div class="cellhead">Path ${k+1}: ${id}${run.study===1?` (Study 1, ${run.vote==='voted'?'votes':'misses the vote'}, ${run.stake} stake; winner drawn 50/50, shown: ${run.outcome})`:` (Study 2, ${run.stake} stake, ${run.outcome})`}</div>`;
    pages.forEach(P=>{html+=`<section class="sheet" data-page="${P.id}">${P.html()}</section>`;});
  });
  app.classList.add('print');app.innerHTML=html;
  app.querySelectorAll('button.next').forEach(b=>b.disabled=false);
}
if(PRINT)renderPrint();else{newRun();render();}
</script>
</body>
</html>
