# Gallery page data (gallery.md renders it as a grid of event cards).
# Each photo needs an `id`; run `python3 _tools/make_gallery_images.py` after adding one,
# which writes assets/images/gallery/thumbs/<id>.webp and large/<id>.webp from `file`.
# Optional per photo: `pos` (CSS object-position for the card crop, e.g. "center 30%").
# Optional per event: `wide: true` makes the card span two columns.

- heading: "2026"
  events:
    - title: "Wharton AI Conference, San Francisco, USA"
      date: "2026"
      wide: true
      text: >-
        Presenting my job market paper, "Codified Expertise: How Generative AI Changes Temporal Coordination
        in Distributed Teams," at the Wharton AI Conference on the San Francisco campus, with an outing to the
        Monterey coast during the conference trip.
      photos:
        - id: 2026-wharton-ai-sf
          file: 2026_Wharton_AI_SF.jpg
          caption: "Presenting Codified Expertise at the Wharton AI Conference, San Francisco."
        - id: 2026-wharton-ai-monterey
          file: 2026_Wharton_AI_Monterey.jpg
          caption: "The Monterey coast during the conference trip."
          pos: "center 40%"
        - id: 2026-wharton-ai-monterey-friends
          file: 2026_Wharton_AI_Monterey_friends.jpg
          caption: "With friends on the Monterey coast."

