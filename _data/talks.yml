# Upcoming talks shown on the homepage.
#
# Listed chronologically by the event's start date (earliest first).
# Fields:
#   month    short month shown in the date chip, e.g. Nov  (use TBC if unscheduled)
#   day      optional day of the month, shown large in the chip
#   year     year shown under the month
#   venue    conference or seminar name (bold line)
#   title    paper title (shown as a tooltip when `paper` is set)
#   paper    optional anchor of the paper on the Research page, e.g. codified-expertise;
#            the row then shows `short` as a link instead of the full title
#   short    short paper name for that link, e.g. Codified Expertise
#   session  optional session name, shown under the title
#   place    optional city and country, or "Online"
#   speaker  optional; set only when someone else presents the paper
#   time     optional clock time, e.g. "Mon 4:15 to 5:30 PM" (the dates go in month/day)
#   room     optional room or building
#   kind     conference | invited | workshop | seminar | consortium  (tag colour)
#   url      optional; makes the venue name a link
#
# Delete an entry once the talk has happened. Anything listed here is
# presented as upcoming, so past talks should be moved to the News section.

